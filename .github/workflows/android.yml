name: Build Android APK 

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Decode the Keystore file into the app folder
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '9.3.1' # FIXED: Updated from 8.0 to 9.3.1 to support AGP 9.1.1
          cache-disabled: true
          arguments: app:assembleRelease
        env:
          KEYSTORE_PATH: release.jks # Tells Gradle to look in the app folder
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }} # This should be 'air' in your Secrets
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Upload the signed RELEASE APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hfm-Release.apk
          path: app/build/outputs/apk/release/app-release.apk