<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Editora Headless Live Commentator & Vision Engine</title>
  <script>
    // --- Global State Variables ---
    let liveWebSocket = null;
    let liveAudioContext = null;
    let isSessionConnected = false;
    let isConnectingSocket = false;
    let pendingScriptText = "";
    let pendingPersonaPrompt = "";
    let accumulatedBotTranscript = "";
    let hasReceivedAudioChunks = false;
    let pendingVisionTargetId = null;

    /**
     * Dispatches diagnostics to Android system log console via the Java Bridge.
     */
    function logDiagnostic(message, category = "INFO") {
      console.log(`[${category}] ${message}`);
      if (window.AndroidInterface && typeof window.AndroidInterface.logDiagnostic === "function") {
        window.AndroidInterface.logDiagnostic(message, category);
      }
    }

    /**
     * Converts raw ArrayBuffer to Base64 string.
     */
    function arrayBufferToBase64(buffer) {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    /**
     * Converts Base64 string to ArrayBuffer.
     */
    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    /**
     * Entry Point 1: Starts commentary voice generation over the persistent Live WebSocket.
     */
    window.startCommentarySession = function(scriptText, personaPrompt) {
      logDiagnostic("startCommentarySession invoked by native engine.", "LIFECYCLE");

      if (!window.AndroidInterface) {
        logDiagnostic("Fatal: Native AndroidInterface bridge is not bound.", "ERROR");
        return;
      }

      pendingScriptText = scriptText || "";
      pendingPersonaPrompt = personaPrompt || "";
      accumulatedBotTranscript = "";
      hasReceivedAudioChunks = false;

      if (liveWebSocket && liveWebSocket.readyState === WebSocket.OPEN && isSessionConnected) {
        logDiagnostic("Reusing persistent WebSocket session for cue.", "NETWORK");
        dispatchCommentaryTurn();
      } else {
        initiateLiveWebSocket(() => dispatchCommentaryTurn());
      }
    };

    /**
     * Entry Point 2: Streams a video frame to Gemini Live to ground target coordinates (Objects/Faces).
     * Operates 100% through the Live Bidi WebSocket without REST HTTP calls.
     */
    window.groundTargetWithVision = function(base64Jpg, targetId, targetDescription) {
      logDiagnostic(`groundTargetWithVision invoked for target: '${targetId}' (${targetDescription})`, "VISION");

      if (!window.AndroidInterface) {
        logDiagnostic("Fatal: Native AndroidInterface bridge is not bound.", "ERROR");
        return;
      }

      pendingVisionTargetId = targetId;

      const executeVisionTurn = () => {
        if (!liveWebSocket || liveWebSocket.readyState !== WebSocket.OPEN) {
          logDiagnostic("Cannot dispatch vision frame: WebSocket not open.", "WARN");
          return;
        }

        const visionPayload = {
          clientContent: {
            turns: [{
              role: "user",
              parts: [
                {
                  inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Jpg
                  }
                },
                {
                  text: `Visually inspect this image. Locate the '${targetDescription}'. ` +
                        `You MUST call the tool function 'locate_target' with target_id '${targetId}' ` +
                        `and its exact normalized bounding box [left, top, right, bottom] coordinates (0.0 to 1.0).`
                }
              ]
            }],
            turnComplete: true
          }
        };

        liveWebSocket.send(JSON.stringify(visionPayload));
        logDiagnostic(`Vision frame dispatched for target '${targetId}'. Awaiting tool call...`, "VISION");
      };

      if (liveWebSocket && liveWebSocket.readyState === WebSocket.OPEN && isSessionConnected) {
        executeVisionTurn();
      } else {
        initiateLiveWebSocket(() => executeVisionTurn());
      }
    };

    /**
     * Connects to the Gemini Live BidiGenerateContent WebSocket endpoint with Tools enabled.
     */
    function initiateLiveWebSocket(onConnectedCallback = null) {
      if (isConnectingSocket) {
        logDiagnostic("WebSocket connection already in progress. Awaiting handshake...", "NETWORK");
        return;
      }

      if (liveWebSocket && liveWebSocket.readyState === WebSocket.OPEN && isSessionConnected) {
        if (typeof onConnectedCallback === "function") onConnectedCallback();
        return;
      }

      isConnectingSocket = true;

      try {
        if (typeof window.AndroidInterface.onLiveSessionConnecting === "function") {
          window.AndroidInterface.onLiveSessionConnecting();
        }

        const apiKey = window.AndroidInterface.getGeminiApiKey();
        let modelId = window.AndroidInterface.getModelId();
        const voiceName = window.AndroidInterface.getVoiceName() || "Puck";

        if (!apiKey || apiKey.trim() === "") {
          const err = "Gemini API Key is empty or missing.";
          logDiagnostic(err, "ERROR");
          if (typeof window.AndroidInterface.onLiveError === "function") {
            window.AndroidInterface.onLiveError(err);
          }
          isConnectingSocket = false;
          return;
        }

        if (modelId.startsWith("models/")) {
          modelId = modelId.replace("models/", "");
        }
        if (!modelId || modelId.trim() === "") {
          modelId = "gemini-3.8-live";
        }

        const endpointUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
        logDiagnostic(`Opening persistent WebSocket channel to: models/${modelId}`, "NETWORK");

        liveWebSocket = new WebSocket(endpointUrl);

        liveWebSocket.onopen = () => {
          logDiagnostic("WebSocket channel opened. Dispatching Setup frame with Vision Tools...", "NETWORK");

          let effectiveSystemInstruction = pendingPersonaPrompt;
          if (!effectiveSystemInstruction || effectiveSystemInstruction.trim() === "") {
            effectiveSystemInstruction = "You are a professional studio video director and voiceover narrator. " +
              "When provided with video frames to locate objects or faces, use the 'locate_target' function to report accurate normalized bounding boxes. " +
              "When provided with a voiceover script, recite the text verbatim with clean studio delivery without conversational filler.";
          }

          const setupPayload = {
            setup: {
              model: "models/" + modelId,
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: {
                      voiceName: voiceName
                    }
                  }
                }
              },
              systemInstruction: {
                parts: [{
                  text: effectiveSystemInstruction
                }]
              },
              tools: [
                {
                  functionDeclarations: [
                    {
                      name: "locate_target",
                      description: "Reports the exact normalized bounding box coordinates for a target object, person, face, or item in the video frame.",
                      parameters: {
                        type: "OBJECT",
                        properties: {
                          target_id: {
                            type: "STRING",
                            description: "The identifier of the target being located."
                          },
                          left: {
                            type: "NUMBER",
                            description: "Normalized left boundary (0.0 to 1.0)."
                          },
                          top: {
                            type: "NUMBER",
                            description: "Normalized top boundary (0.0 to 1.0)."
                          },
                          right: {
                            type: "NUMBER",
                            description: "Normalized right boundary (0.0 to 1.0)."
                          },
                          bottom: {
                            type: "NUMBER",
                            description: "Normalized bottom boundary (0.0 to 1.0)."
                          }
                        },
                        required: ["left", "top", "right", "bottom"]
                      }
                    }
                  ]
                }
              ]
            }
          };

          liveWebSocket.send(JSON.stringify(setupPayload));
          logDiagnostic("Setup frame dispatched successfully.", "NETWORK");
        };

        liveWebSocket.onmessage = async (event) => {
          try {
            let payload;
            if (event.data instanceof Blob) {
              const textContent = await event.data.text();
              payload = JSON.parse(textContent);
            } else {
              payload = JSON.parse(event.data);
            }

            // 1. Handshake Confirmation
            if (payload.setupComplete) {
              isConnectingSocket = false;
              isSessionConnected = true;
              logDiagnostic("Handshake complete: Live Model authenticated with Vision Tools.", "NETWORK");

              if (typeof window.AndroidInterface.onLiveSessionConnected === "function") {
                window.AndroidInterface.onLiveSessionConnected();
              }

              if (typeof onConnectedCallback === "function") {
                onConnectedCallback();
              }
              return;
            }

            // 2. Server Error Frame
            if (payload.error) {
              isConnectingSocket = false;
              const errorMsg = "Gemini Live API Error: " + JSON.stringify(payload.error);
              logDiagnostic(errorMsg, "ERROR");
              if (typeof window.AndroidInterface.onLiveError === "function") {
                window.AndroidInterface.onLiveError(errorMsg);
              }
              return;
            }

            // 3. Incoming Tool Calls (Function Calling for Visual Coordinates)
            if (payload.toolCall && payload.toolCall.functionCalls) {
              for (const call of payload.toolCall.functionCalls) {
                if (call.name === "locate_target") {
                  const args = call.args || {};
                  const targetId = args.target_id || pendingVisionTargetId || "target";
                  const left = parseFloat(args.left) || 0.0;
                  const top = parseFloat(args.top) || 0.0;
                  const right = parseFloat(args.right) || 1.0;
                  const bottom = parseFloat(args.bottom) || 1.0;

                  logDiagnostic(`🎯 [LIVE-VISION] ToolCall: ${targetId} -> L:${left.toFixed(3)}, T:${top.toFixed(3)}, R:${right.toFixed(3)}, B:${bottom.toFixed(3)}`, "VISION");

                  if (window.AndroidInterface && typeof window.AndroidInterface.onTargetCoordinatesReceived === "function") {
                    window.AndroidInterface.onTargetCoordinatesReceived(targetId, left, top, right, bottom);
                  }

                  // Acknowledge tool call so WebSocket session stays synchronized
                  sendToolResponse("locate_target", { status: "coordinates_registered" }, call.id);
                }
              }
            }

            // 4. Incoming Audio Stream & Transcripts
            if (payload.serverContent) {
              const serverContent = payload.serverContent;

              if (serverContent.modelTurn && serverContent.modelTurn.parts) {
                for (const part of serverContent.modelTurn.parts) {
                  // Forward transcript text if provided
                  if (part.text) {
                    accumulatedBotTranscript += part.text;
                    if (typeof window.AndroidInterface.onLiveCommentaryText === "function") {
                      window.AndroidInterface.onLiveCommentaryText(part.text);
                    }
                  }

                  // Stream raw 24kHz PCM Audio Chunk to Android Kotlin
                  if (part.inlineData && part.inlineData.data) {
                    hasReceivedAudioChunks = true;
                    const base64Chunk = part.inlineData.data;

                    if (typeof window.AndroidInterface.onLiveAudioChunkReceived === "function") {
                      window.AndroidInterface.onLiveAudioChunkReceived(base64Chunk);
                    }
                  }
                }
              }

              // 5. Model Turn Complete
              if (serverContent.turnComplete) {
                logDiagnostic("Gemini Live turn completed.", "LIFECYCLE");

                if (typeof window.AndroidInterface.onLiveCommentaryFinished === "function") {
                  window.AndroidInterface.onLiveCommentaryFinished();
                }
              }
            }
          } catch (parseError) {
            logDiagnostic("Error parsing WebSocket frame: " + parseError.message, "ERROR");
          }
        };

        liveWebSocket.onclose = (event) => {
          isConnectingSocket = false;
          isSessionConnected = false;
          liveWebSocket = null;
          logDiagnostic(`WebSocket closed [Code: ${event.code}, Reason: ${event.reason || "None"}]`, "NETWORK");
        };

        liveWebSocket.onerror = (err) => {
          isConnectingSocket = false;
          isSessionConnected = false;
          liveWebSocket = null;
          logDiagnostic("WebSocket network error encountered.", "ERROR");
          if (typeof window.AndroidInterface.onLiveError === "function") {
            window.AndroidInterface.onLiveError("WebSocket connection failure.");
          }
        };

      } catch (exception) {
        isConnectingSocket = false;
        isSessionConnected = false;
        liveWebSocket = null;
        logDiagnostic("Exception in initiateLiveWebSocket: " + exception.message, "ERROR");
        if (typeof window.AndroidInterface.onLiveError === "function") {
          window.AndroidInterface.onLiveError(exception.message);
        }
      }
    }

    /**
     * Responds to Gemini Live Tool Calls so the bidirectional stream continues.
     */
    function sendToolResponse(name, responseObj, callId) {
      if (!liveWebSocket || liveWebSocket.readyState !== WebSocket.OPEN) return;
      const toolResponsePayload = {
        toolResponse: {
          functionResponses: [{
            response: { output: responseObj },
            id: callId
          }]
        }
      };
      liveWebSocket.send(JSON.stringify(toolResponsePayload));
    }

    /**
     * Sends the commentary script turn to the connected Gemini Live model.
     */
    function dispatchCommentaryTurn() {
      if (!liveWebSocket || liveWebSocket.readyState !== WebSocket.OPEN) {
        logDiagnostic("Cannot dispatch commentary turn: WebSocket not open. Re-initiating...", "WARN");
        initiateLiveWebSocket(() => dispatchCommentaryTurn());
        return;
      }

      logDiagnostic("Dispatching verbatim script to Live model...", "LIFECYCLE");

      const promptPayload = {
        clientContent: {
          turns: [{
            role: "user",
            parts: [{
              text: "CRITICAL: You are a professional voiceover narrator. Recite the following script verbatim. " +
                    "Do NOT say 'Okay', 'Sure', or add any greeting or conversational filler. " +
                    "Begin reciting the script immediately:\n\n" +
                    pendingScriptText
            }]
          }],
          turnComplete: true
        }
      };

      liveWebSocket.send(JSON.stringify(promptPayload));
      logDiagnostic("Commentary clientContent turn dispatched.", "NETWORK");
    }

    /**
     * Stops the WebSocket session and cleans up resources when production finishes.
     */
    window.stopCommentarySession = function() {
      logDiagnostic("stopCommentarySession invoked. Disposing WebSocket connection...", "LIFECYCLE");
      isSessionConnected = false;
      isConnectingSocket = false;

      if (liveWebSocket) {
        try {
          if (liveWebSocket.readyState === WebSocket.OPEN || liveWebSocket.readyState === WebSocket.CONNECTING) {
            liveWebSocket.close();
          }
        } catch (e) {
          // ignore
        }
        liveWebSocket = null;
      }

      if (liveAudioContext) {
        try {
          liveAudioContext.close();
        } catch (e) {
          // ignore
        }
        liveAudioContext = null;
      }
    };
  </script>
</head>
<body style="background-color: #0B0E14; color: #FFFFFF; font-family: monospace; padding: 16px;">
  <h3>Editora Headless Live Commentator Runtime</h3>
  <div id="status">Status: Persistent Engine Initialized with Live Vision Tools</div>
</body>
</html>
